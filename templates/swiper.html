<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic | Discovery Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1db954;
            --background: #121212;
            --surface: #181818;
            --text-main: #ffffff;
            --text-secondary: #b3b3b3;
            --like-color: #4cd964;
            --nope-color: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            background: radial-gradient(circle at 50% -20%, #2a2a2a, var(--background));
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span { color: var(--primary); }

        .close-btn {
            color: var(--text-secondary);
            font-size: 1.5rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .close-btn:hover { color: var(--text-main); }

        .stack-container {
            flex: 1;
            width: 100%;
            max-width: 400px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            position: absolute;
            width: 90%;
            height: 70vh;
            border-radius: 20px;
            background-color: var(--surface);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            transform-origin: 50% 100%;
            will-change: transform, opacity;
            display: flex;
            flex-direction: column;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2rem 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .card-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-artist {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 0.5rem;
        }

        .card-genre {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
        }

        .status-badge {
            position: absolute;
            top: 2rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 3px solid;
            font-weight: 800;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            z-index: 10;
        }

        .like-badge {
            left: 2rem;
            color: var(--like-color);
            border-color: var(--like-color);
            transform: rotate(-15deg);
        }

        .nope-badge {
            right: 2rem;
            color: var(--nope-color);
            border-color: var(--nope-color);
            transform: rotate(15deg);
        }

        .controls {
            width: 100%;
            max-width: 400px;
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            z-index: 100;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background-color: var(--surface);
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.1);
            color: var(--text-main);
        }

        .btn-like { color: var(--like-color); }
        .btn-nope { color: var(--nope-color); }

        .btn-like:active { background-color: var(--like-color); color: white; }
        .btn-nope:active { background-color: var(--nope-color); color: white; }

        .loader-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s infinite linear;
            margin-bottom: 1rem;
        }

        /* Results View */
        .results-view {
            display: none;
            width: 100%;
            max-width: 600px;
            height: 100%;
            padding: 3rem 1.5rem;
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
        }

        .results-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .results-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .results-header p {
            color: var(--text-secondary);
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-bottom: 3rem;
            width: 100%;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background-color: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .track-item:hover {
            background-color: #252525;
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
        }

        .track-thumb {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .track-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-name {
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-artist {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .spotify-icon {
            color: var(--primary);
            font-size: 1.8rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .track-item:hover .spotify-icon {
            opacity: 1;
            transform: scale(1.1);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">Harmonic<span>.</span></a>
        <a href="/" class="close-btn"><i class="fas fa-times"></i></a>
    </div>

    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p>Curating songs...</p>
    </div>

    <div class="stack-container" id="stack-container">
        <!-- Cards injected here -->
    </div>

    <div class="controls" id="controls">
        <button class="control-btn btn-nope" onclick="handleButtonSwipe('left')">
            <i class="fas fa-times"></i>
        </button>
        <button class="control-btn btn-like" onclick="handleButtonSwipe('right')">
            <i class="fas fa-heart"></i>
        </button>
    </div>

    <div class="results-view" id="results-view">
        <div class="results-header">
            <h2>Your Playlist</h2>
            <p>Based on your swipes</p>
        </div>
        <div class="track-list" id="track-list"></div>
        <div style="text-align: center;">
            <a href="/" class="control-btn" style="width: auto; height: auto; padding: 1rem 2rem; border-radius: 30px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 600;">Back to Home</a>
        </div>
    </div>

    <script>
        // State
        let cards = [];
        let likedSongs = [];
        let currentIndex = 0;
        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        const stackContainer = document.getElementById('stack-container');
        const loader = document.getElementById('loader');
        const controls = document.getElementById('controls');
        const resultsView = document.getElementById('results-view');

        // Initialize
        async function init() {
            try {
                const res = await fetch('/api/swiper');
                const data = await res.json();

                if (data && data.length > 0) {
                    cards = data;
                    renderStack();
                    loader.style.display = 'none';
                } else {
                    alert("No songs available right now.");
                }
            } catch (err) {
                console.error(err);
                loader.innerHTML = '<p style="color:red">Failed to load songs.</p>';
            }
        }

        function renderStack() {
            stackContainer.innerHTML = '';
            // Render last to first so first is on top in DOM (z-index handled naturally or manually)
            // Actually better to render first to last and use z-index.
            
            // We only render current and next few for performance
            const limit = Math.min(cards.length, currentIndex + 3);
            
            for (let i = currentIndex; i < limit; i++) {
                const song = cards[i];
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.style.zIndex = 100 - i;

                // Add scale effect for depth
                const depth = i - currentIndex;
                const scale = 1 - (depth * 0.05);
                const translateY = depth * 10;
                cardEl.style.transform = `scale(${scale}) translateY(${translateY}px)`;

                // Content
                const img = song.image_url || 'https://via.placeholder.com/400x600?text=No+Image';

                cardEl.innerHTML = `
                    <img src="${img}" class="card-image" draggable="false">
                    <div class="status-badge like-badge">LIKE</div>
                    <div class="status-badge nope-badge">NOPE</div>
                    <div class="card-overlay">
                        <div class="card-title">${song.name}</div>
                        <div class="card-artist">${song.artist}</div>
                        <div class="card-genre">${song.genre}</div>
                    </div>
                `;

                if (i === currentIndex) {
                    initDrag(cardEl);
                }

                stackContainer.appendChild(cardEl);
            }
        }

        function initDrag(card) {
            const onDown = (e) => {
                isDragging = true;
                startX = e.clientX || e.touches[0].clientX;
                card.style.transition = 'none';
            };

            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.clientX || e.touches[0].clientX;
                currentX = clientX - startX;
                const rotate = currentX * 0.05;

                card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

                // Opacity of badges
                const likeBadge = card.querySelector('.like-badge');
                const nopeBadge = card.querySelector('.nope-badge');

                if (currentX > 0) {
                    likeBadge.style.opacity = Math.min(currentX / 100, 1);
                    nopeBadge.style.opacity = 0;
                } else {
                    nopeBadge.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
                    likeBadge.style.opacity = 0;
                }
            };

            const onUp = () => {
                if (!isDragging) return;
                isDragging = false;

                const threshold = 100;

                if (currentX > threshold) {
                    swipe('right');
                } else if (currentX < -threshold) {
                    swipe('left');
                } else {
                    // Reset
                    card.style.transition = 'transform 0.3s ease';
                    card.style.transform = 'scale(1) translateY(0)';
                    card.querySelector('.like-badge').style.opacity = 0;
                    card.querySelector('.nope-badge').style.opacity = 0;
                }
                currentX = 0;
            };

            card.addEventListener('mousedown', onDown);
            card.addEventListener('touchstart', onDown);
            
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove);
            
            document.addEventListener('mouseup', onUp);
            document.addEventListener('touchend', onUp);
        }

        async function swipe(dir) {
            const card = stackContainer.firstElementChild; // Current top card
            if (!card) return;
            
            // Animate out
            const moveX = dir === 'right' ? window.innerWidth : -window.innerWidth;
            card.style.transition = 'transform 0.5s ease, opacity 0.5s';
            card.style.transform = `translateX(${moveX}px) rotate(${dir === 'right' ? 30 : -30}deg)`;
            card.style.opacity = 0;
            
            // Logic
            const song = cards[currentIndex];
            if (dir === 'right') {
                likedSongs.push(song.id_internal || song.id); // Assuming backend sends id or we use index logic
                await fetch('/swipe', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({song_id: song.id_internal})
                });
            }

            currentIndex++;

            setTimeout(() => {
                if (currentIndex >= 10 || (currentIndex >= cards.length)) {
                    finishSwiping();
                } else {
                    renderStack();
                }
            }, 300);
        }

        function handleButtonSwipe(dir) {
            swipe(dir);
        }

        async function finishSwiping() {
            stackContainer.style.display = 'none';
            controls.style.display = 'none';
            loader.style.display = 'block';
            loader.innerHTML = '<div class="loader"></div><p>Generating recommendations...</p>';
            
            try {
                const res = await fetch('/swipe', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({song_id: -1})
                });
                const data = await res.json();
                
                showResults(data.recommendations || []);
            } catch (err) {
                console.error(err);
                showResults([]); // Show empty or error state
            }
        }

        function showResults(songs) {
            loader.style.display = 'none';
            resultsView.style.display = 'flex';
            
            const list = document.getElementById('track-list');
            
            if (songs.length === 0) {
                list.innerHTML = '<p style="text-align:center">No recommendations found. Try swiping right more!</p>';
                return;
            }
            
            list.innerHTML = songs.map(song => {
                const query = encodeURIComponent(`${song.name} ${song.artist}`);
                const spotifyLink = `https://open.spotify.com/search/${query}`;

                return `
                <a href="${spotifyLink}" target="_blank" class="track-item" title="Listen on Spotify">
                    <img src="${song.image_url || 'https://via.placeholder.com/60'}" class="track-thumb" alt="${song.name}">
                    <div class="track-info">
                        <div class="track-name">${song.name}</div>
                        <div class="track-artist">${song.artist}</div>
                    </div>
                    <i class="fab fa-spotify spotify-icon"></i>
                </a>
            `}).join('');
        }

        init();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic | Music Discovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1db954;
            --primary-dark: #1aa34a;
            --background: #121212;
            --surface: #181818;
            --surface-hover: #282828;
            --text-main: #ffffff;
            --text-secondary: #b3b3b3;
            --error: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05rem;
        }

        h1 span {
            color: var(--primary);
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 3rem;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        #query {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            border-radius: 50px;
            border: none;
            background-color: var(--text-main);
            color: var(--background);
            font-size: 1.1rem;
            font-weight: 500;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #query:focus {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(29, 185, 84, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--background);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--background);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #results {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface);
            border-radius: 8px;
            padding: 1rem;
            transition: background-color 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card:hover {
            background-color: var(--surface-hover);
        }

        .card-img-wrapper {
            width: 100%;
            padding-bottom: 100%; /* 1:1 Aspect Ratio */
            position: relative;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-artist {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .genre-tag {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin: 2rem auto;
        }

        .error-msg {
            color: var(--error);
            text-align: center;
            padding: 1rem;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 8px;
            width: 100%;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { padding: 1rem; }
            #results { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Harmonic<span>.</span></h1>
            <p class="tagline">Discover music that resonates with you</p>
        </header>

        <div class="search-container">
            <div class="search-input-wrapper">
                <input type="text" id="query" placeholder="What do you want to listen to?" autocomplete="off">
                <i class="fas fa-search search-icon" onclick="getRecommendations()"></i>
            </div>
        </div>

        <div class="actions">
            <a href="/swiper" class="btn btn-secondary">
                <i class="fas fa-layer-group"></i> Discovery Mode
            </a>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const queryInput = document.getElementById('query');
        const resultsContainer = document.getElementById('results');

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        const handleSearch = async () => {
            const query = queryInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = '';
                return;
            }

            resultsContainer.innerHTML = '<div class="loader"></div>';

            try {
                const response = await fetch(`/recommend?query=${encodeURIComponent(query)}`);
                const songs = await response.json();

                if (songs.length === 0) {
                    resultsContainer.innerHTML = '<div class="error-msg">No results found. Try a different artist or genre.</div>';
                    return;
                }

                resultsContainer.innerHTML = songs.map(song => {
                    // Use provided image or fallback
                    const imgUrl = song.image_url || `https://via.placeholder.com/300x300/181818/b3b3b3?text=${encodeURIComponent(song.name[0])}`;

                    return `
                        <div class="card">
                            <div class="card-img-wrapper">
                                <img src="${imgUrl}" alt="${song.name}" class="card-img" loading="lazy">
                            </div>
                            <div class="card-content">
                                <div class="card-title" title="${song.name}">${song.name}</div>
                                <div class="card-artist" title="${song.artist}">${song.artist}</div>
                                <div class="card-meta">
                                    <span class="genre-tag">${song.genre}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = '<div class="error-msg">Something went wrong. Please try again.</div>';
            }
        };

        const debouncedSearch = debounce(handleSearch, 500);

        queryInput.addEventListener('input', debouncedSearch);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>

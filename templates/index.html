<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonic | Music Discovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Harmonic<span>.</span></h1>
            <p class="tagline">Discover music that resonates with you. Powered by AI.</p>
        </header>

        <div class="search-container">
            <div class="search-input-wrapper">
                <input type="text" id="query" placeholder="Search for songs, artists, or genres..." autocomplete="off">
                <i class="fas fa-search search-icon" onclick="getRecommendations()"></i>
            </div>
        </div>

        <div class="actions">
            <a href="/swiper" class="btn btn-primary">
                <i class="fas fa-fire"></i> Try Discovery Mode
            </a>
            <!-- Added a secondary button for visual balance, maybe links to GitHub or About in future, for now acts as a scroll to results or just disabled-like -->
            <!-- <button class="btn btn-secondary">
                <i class="fas fa-info-circle"></i> Learn More
            </button> -->
        </div>

        <div id="results"></div>
    </div>

    <script>
        const queryInput = document.getElementById('query');
        const resultsContainer = document.getElementById('results');

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        const handleSearch = async () => {
            const query = queryInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = '';
                return;
            }

            resultsContainer.innerHTML = '<div class="loader"></div>';

            try {
                const response = await fetch(`/recommend?query=${encodeURIComponent(query)}`);
                const songs = await response.json();

                if (songs.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">No results found. Try a different query.</div>';
                    return;
                }

                resultsContainer.innerHTML = songs.map((song, index) => {
                    // Use provided image or fallback
                    const imgUrl = song.image_url || `https://via.placeholder.com/300x300/181818/b3b3b3?text=${encodeURIComponent(song.name[0])}`;
                    // Stagger animation for cards
                    const style = `animation: fadeInUp 0.5s ease-out ${index * 0.1}s backwards`;

                    return `
                        <div class="card" style="${style}" onclick="window.open('https://open.spotify.com/search/${encodeURIComponent(song.name + ' ' + song.artist)}', '_blank')">
                            <div class="card-img-wrapper">
                                <img src="${imgUrl}" alt="${song.name}" class="card-img" loading="lazy">
                            </div>
                            <div class="card-content">
                                <div class="card-title" title="${song.name}">${song.name}</div>
                                <div class="card-artist" title="${song.artist}">${song.artist}</div>
                                <div class="card-meta">
                                    <span class="genre-tag">${song.genre}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = '<div class="error-msg">Something went wrong. Please try again.</div>';
            }
        };

        const debouncedSearch = debounce(handleSearch, 500);

        queryInput.addEventListener('input', debouncedSearch);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>
